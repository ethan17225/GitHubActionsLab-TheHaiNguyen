name: Multi-Platform Testing

on:
  pull_request:
    branches: [ "main" ]

jobs:
  ubuntu-job:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Print OS Info
        run: echo "Running on Ubuntu Linux"
        
      - name: Show System Info
        run: uname -a
        
      - name: Create and Show File
        run: |
          echo "Hello from Linux" > linux-artifact.txt
          cat linux-artifact.txt

  windows-job:
    name: Run on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Print OS Info
        run: echo "Running on Windows"
        
      - name: Show System Info
        run: systeminfo
        
      - name: Create and Show File
        run: |
          echo "Hello from Windows" > win-artifact.txt
          type win-artifact.txt

  macos-job:
    name: Run on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Print OS Info
        run: echo "Running on macOS"
        
      - name: Show System Info
        run: uname -a
        
      - name: Create and Show File
        run: |
          echo "Hello from macOS" > mac-artifact.txt
          cat mac-artifact.txt
